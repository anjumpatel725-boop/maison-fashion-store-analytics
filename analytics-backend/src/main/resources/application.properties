
spring.application.name=analytics-backend

# PostgreSQL R2DBC configuration

spring.r2dbc.url=${DB_URL:r2dbc:postgresql://localhost:5432/analytics_db}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:}


# Actuator health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.mongo.enabled=false
management.health.mongo-reactive.enabled=false